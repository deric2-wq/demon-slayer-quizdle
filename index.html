// Tentativas persistentes
let tentativas = JSON.parse(localStorage.getItem("tentativas")) || [];

// Comparar atributos
function comparar(p, alvo) {
    const campos = ["genero","especie","afiliacao","estilo","patente","cabelo","status"];
    let res = {};
    campos.forEach(campo => {
        const valorP = p[campo].toString().trim().toLowerCase();
        const valorAlvo = alvo[campo].toString().trim().toLowerCase();
        res[campo] = (valorP === valorAlvo) ? "verde" : "vermelho";
    });
    return res;
}

        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td>
            <img src="static/img/${t.dados.img}" class="foto">
            <div class="nome">${t.dados.personagem}</div>
        </td>
        <td class="${t.resultado.genero}">${t.dados.genero}</td>
        <td class="${t.resultado.especie}">${t.dados.especie}</td>
        <td class="${t.resultado.afiliacao}">${t.dados.afiliacao}</td>
        <td class="${t.resultado.estilo}">${t.dados.estilo}</td>
        <td class="${t.resultado.patente}">${t.dados.patente}</td>
        <td class="${t.resultado.cabelo}">${t.dados.cabelo}</td>
        <td class="${t.resultado.status}">${t.dados.status}</td>
        `;
        tbody.appendChild(tr);

        // Animação apenas na tentativa mais recente
        if(index === 0){
            const tds = tr.querySelectorAll("td:not(:first-child)");
            tds.forEach((td, i)=>{
                td.classList.add("fade-in");
                td.style.animationDelay = `${i * 0.30}s`;
            });
        }
    });
}
renderTentativas();

// Autocomplete e sugestões
// Sugestões visíveis
const input = document.getElementById("input");
const sugestoesDiv = document.getElementById("sugestoes");
// Referência aos sons
const somStart = document.getElementById("som-start");
const somVitoria = document.getElementById("som-vitoria");

// Ajustar volume (0 a 1)
somStart.volume = 0.1;   // 30% do volume
somVitoria.volume = 0.2; // 50% do volume

let sugestaoAtual = null; // Primeira sugestão visível

input.addEventListener("input", function(){
    const valor = this.value.toLowerCase().trim();
    sugestoesDiv.innerHTML = "";
    sugestaoAtual = null;

    if(valor === "") return;

    personagens.forEach(p=>{
        if(p.personagem.toLowerCase().includes(valor)){
            const div = document.createElement("div");
            div.classList.add("sugestao");

            // Adiciona a foto do personagem
            const img = document.createElement("img");
            img.src = "static/img/" + p.img;
            img.alt = p.personagem;
            img.classList.add("sugestao-img"); // classe para estilizar no CSS
            div.appendChild(img);

            // Adiciona o nome
            const span = document.createElement("span");
            span.innerText = p.personagem;
            div.appendChild(span);

            // Ao clicar na sugestão
            div.onclick = ()=>{
                input.value = p.personagem;
                sugestoesDiv.innerHTML = "";
                submitTentativa();
            }

            sugestoesDiv.appendChild(div);

            // Primeira sugestão
            if(!sugestaoAtual) sugestaoAtual = p.personagem;

        }
    });
});

// Enviar tentativa
function submitTentativa(){
    let valor = input.value.toLowerCase().trim();

    if(sugestaoAtual){
        valor = sugestaoAtual.toLowerCase();
    }

    if(mapeamento[valor]){
        const nomeCompleto = mapeamento[valor];
        const p = personagens.find(x=>x.personagem === nomeCompleto);

        const resultado = comparar(p, personagemDoDia);
        tentativas.unshift({dados: p, resultado: resultado});
        localStorage.setItem("tentativas", JSON.stringify(tentativas));

        renderTentativas();
        input.value = "";
        sugestoesDiv.innerHTML = "";
        sugestaoAtual = null;

// Verifica se o jogador acertou **todos os atributos**, mas só após a animação terminar
const tds = document.querySelectorAll("#tabela-tentativas tr:first-child td:not(:first-child)");
let animacoesConcluidas = 0;

tds.forEach(td => {
    td.addEventListener("animationend", () => {
        animacoesConcluidas++;
        // Quando todas as células da tentativa mais recente terminaram a animação
        if(animacoesConcluidas === tds.length){
            const acertouTudo = Object.values(resultado).every(c => c === "verde");
            if(acertouTudo){
                const modal = document.getElementById("modal-vitoria");
                const foto = document.getElementById("foto-vitoria");
                const nome = document.getElementById("nome-vitoria");

                // colocar imagem e nome do personagem do dia
                foto.src = `static/img/${personagemDoDia.img}`;
                foto.alt = personagemDoDia.personagem;
                nome.innerText = `Era "${personagemDoDia.personagem}"`;

                modal.style.display = "flex";

                // tocar som de vitória
                setTimeout(() => {
                    somVitoria.play().catch(() => console.log("Som de vitória bloqueado pelo navegador."));
                }, 100);

                document.getElementById("btn-novamente").onclick = () => {
                    localStorage.removeItem("tentativas");
                    localStorage.removeItem("personagemDoDiaKey");
                    tentativas = [];
                    modal.style.display = "none";
                    location.reload();
                };
            }

}

    }, {once: true}); // garante que o listener só execute uma vez
});

    } else {
        alert("Personagem não encontrado");
    }
}
// Ativar Enter para aceitar a primeira sugestão do autocompletar
input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        if(sugestaoAtual){
            input.value = sugestaoAtual; // coloca a primeira sugestão no input
            sugestoesDiv.innerHTML = ""; // limpa as sugestões
        }
        submitTentativa(); // envia a tentativa
    }
});
document.addEventListener("DOMContentLoaded", () => {
    const somStart = document.getElementById("som-start");
    if(somStart){
        // Tenta tocar o som
        const playPromise = somStart.play();
        if(playPromise !== undefined){
            playPromise.catch(error => {
                console.log("Som inicial bloqueado pelo navegador:", error);
            });
        }
    // Tocar som de início quando a página carregar
    window.addEventListener("load", () => {
    somStart.play().catch(() => console.log("Som de início bloqueado pelo navegador."));
});

    }
});

</script>
