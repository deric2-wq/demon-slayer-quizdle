<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Demon Slayer Quizdle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<audio id="som-start" src="sounds/start.mp3"></audio>
<audio id="som-vitoria" src="sounds/vitoria.mp3"></audio>

<div class="container">
    <!-- Logo centralizada -->
    <img src="img/logo.png" alt="Demon Slayer Quizdle" class="logo">

    <!-- Frase do dia como PNG -->
    <img src="img/letras.png" alt="Frase do Dia" class="frase-logo">

    <div class="input-container">
        <input type="text" id="input" class="input" placeholder="Digite o nome do personagem" autocomplete="off">
        <div id="sugestoes" class="sugestoes"></div>

        <!-- Modal de Vitória -->
        <div id="modal-vitoria" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Parabéns! Você acertou!</h2>
                <img id="foto-vitoria" src="" alt="Personagem" class="foto-modal">
                <div id="nome-vitoria" class="nome-personagem-modal"></div>
                <button id="btn-novamente" class="botao">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>Gênero</th>
                <th>Espécie</th>
                <th>Afiliação</th>
                <th>Estilo</th>
                <th>Patente</th>
                <th>Cabelo</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tabela-tentativas">
        </tbody>
    </table>
</div>

<script>
// Lista de personagens
const personagens = [
    { "personagem": "Tanjiro Kamado", "img": "tanjiro.png", "genero": "Homem", "especie": "Humano", "afiliacao": "Caçadores de Demônios", "estilo": "Hinokami Kagura", "patente": "Caçador", "cabelo": "Preto", "status": "Vivo" },
    { "personagem": "Nezuko Kamado", "img": "nezuko.png", "genero": "Mulher", "especie": "Demônio", "afiliacao": "Caçadores de Demônios", "estilo": "Arte Demoníaca", "patente": "Caçador", "cabelo": "Preto", "status": "Vivo" },
    { "personagem": "Zenitsu Agatsuma", "img": "zenitsu.png", "genero": "Homem", "especie": "Humano", "afiliacao": "Caçadores de Demônios", "estilo": "Respiração do Trovão", "patente": "Caçador", "cabelo": "Amarelo", "status": "Vivo" },
    { "personagem": "Inosuke Hashibira", "img": "inosuke.png", "genero": "Homem", "especie": "Humano", "afiliacao": "Caçadores de Demônios", "estilo": "Respiração da Fera", "patente": "Caçador", "cabelo": "Preto", "status": "Vivo" },
    { "personagem": "Giyu Tomioka", "img": "giyu.png", "genero": "Homem", "especie": "Humano", "afiliacao": "Caçadores de Demônios", "estilo": "Respiração da Água", "patente": "Hashira", "cabelo": "Preto", "status": "Vivo" }
    // ... continue adicionando todos os personagens da mesma forma
];

// Mapear abreviações para nome completo
const mapeamento = {
    "tanjiro": "Tanjiro Kamado", "tanjiro kamado": "Tanjiro Kamado",
    "nezuko": "Nezuko Kamado", "nezuko kamado": "Nezuko Kamado",
    "zenitsu": "Zenitsu Agatsuma", "zenitsu agatsuma": "Zenitsu Agatsuma",
    "inosuke": "Inosuke Hashibira", "inosuke hashibira": "Inosuke Hashibira",
    "giyu": "Giyu Tomioka", "giyu tomioka": "Giyu Tomioka"
    // ... continue adicionando o restante
};

// Personagem do dia
let personagemDoDiaKey = localStorage.getItem("personagemDoDiaKey");
if (!personagemDoDiaKey) {
    personagemDoDiaKey = Math.floor(Math.random() * personagens.length);
    localStorage.setItem("personagemDoDiaKey", personagemDoDiaKey);
}
const personagemDoDia = personagens[personagemDoDiaKey];

// Tentativas persistentes
let tentativas = JSON.parse(localStorage.getItem("tentativas")) || [];

// Comparar atributos
function comparar(p, alvo) {
    const campos = ["genero","especie","afiliacao","estilo","patente","cabelo","status"];
    let res = {};
    campos.forEach(campo => {
        const valorP = p[campo].toString().trim().toLowerCase();
        const valorAlvo = alvo[campo].toString().trim().toLowerCase();
        res[campo] = (valorP === valorAlvo) ? "verde" : "vermelho";
    });
    return res;
}

// Renderizar tentativas
function renderTentativas() {
    const tbody = document.getElementById("tabela-tentativas");
    tbody.innerHTML = "";

    tentativas.forEach((t, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td>
            <img src="img/${t.dados.img}" class="foto">
            <div class="nome">${t.dados.personagem}</div>
        </td>
        <td class="${t.resultado.genero}">${t.dados.genero}</td>
        <td class="${t.resultado.especie}">${t.dados.especie}</td>
        <td class="${t.resultado.afiliacao}">${t.dados.afiliacao}</td>
        <td class="${t.resultado.estilo}">${t.dados.estilo}</td>
        <td class="${t.resultado.patente}">${t.dados.patente}</td>
        <td class="${t.resultado.cabelo}">${t.dados.cabelo}</td>
        <td class="${t.resultado.status}">${t.dados.status}</td>
        `;
        tbody.appendChild(tr);
    });
}
renderTentativas();

// Autocomplete e sugestões
const input = document.getElementById("input");
const sugestoesDiv = document.getElementById("sugestoes");
const somStart = document.getElementById("som-start");
const somVitoria = document.getElementById("som-vitoria");

somStart.volume = 0.1;
somVitoria.volume = 0.2;

let sugestaoAtual = null;

input.addEventListener("input", function(){
    const valor = this.value.toLowerCase().trim();
    sugestoesDiv.innerHTML = "";
    sugestaoAtual = null;

    if(valor === "") return;

    personagens.forEach(p=>{
        if(p.personagem.toLowerCase().includes(valor)){
            const div = document.createElement("div");
            div.classList.add("sugestao");

            const img = document.createElement("img");
            img.src = "img/" + p.img;
            img.alt = p.personagem;
            img.classList.add("sugestao-img");
            div.appendChild(img);

            const span = document.createElement("span");
            span.innerText = p.personagem;
            div.appendChild(span);

            div.onclick = ()=>{
                input.value = p.personagem;
                sugestoesDiv.innerHTML = "";
                submitTentativa();
            }

            sugestoesDiv.appendChild(div);

            if(!sugestaoAtual) sugestaoAtual = p.personagem;
        }
    });
});

function submitTentativa(){
    let valor = input.value.toLowerCase().trim();
    if(sugestaoAtual){
        valor = sugestaoAtual.toLowerCase();
    }

    if(mapeamento[valor]){
        const nomeCompleto = mapeamento[valor];
        const p = personagens.find(x=>x.personagem === nomeCompleto);

        const resultado = comparar(p, personagemDoDia);
        tentativas.unshift({dados: p, resultado: resultado});
        localStorage.setItem("tentativas", JSON.stringify(tentativas));

        renderTentativas();
        input.value = "";
        sugestoesDiv.innerHTML = "";
        sugestaoAtual = null;

        const acertouTudo = Object.values(resultado).every(c => c === "verde");
        if(acertouTudo){
            const modal = document.getElementById("modal-vitoria");
            const foto = document.getElementById("foto-vitoria");
            const nome = document.getElementById("nome-vitoria");

            foto.src = `img/${personagemDoDia.img}`;
            foto.alt = personagemDoDia.personagem;
            nome.innerText = `Era "${personagemDoDia.personagem}"`;

            modal.style.display = "flex";
            somVitoria.play().catch(() => console.log("Som de vitória bloqueado."));

            document.getElementById("btn-novamente").onclick = () => {
                localStorage.removeItem("tentativas");
                localStorage.removeItem("personagemDoDiaKey");
                tentativas = [];
                modal.style.display = "none";
                location.reload();
            };
        }
    } else {
        alert("Personagem não encontrado");
    }
}

input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        if(sugestaoAtual){
            input.value = sugestaoAtual;
            sugestoesDiv.innerHTML = "";
        }
        submitTentativa();
    }
});

document.addEventListener("DOMContentLoaded", () => {
    somStart.play().catch(() => console.log("Som inicial bloqueado pelo navegador."));
});

</script>

</body>
</html>
